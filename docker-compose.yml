services:
  app:
    build:
      context: .
      target: runtime
    image: transcription-service
    ports:
      # Published on this machine only: the service has no authentication.
      # Use another port with: PORT=8080 docker compose up
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      # The job database and uploads in progress survive `docker compose down`.
      - data:/data
    environment:
      # Passed through when set in the shell or in a .env file next to this file
      # (see .env.example). The model is not here: it is baked into the image, so it
      # is changed at build time.
      - WHISPER_CPU_THREADS
      - WHISPER_BEAM_SIZE
      - MAX_UPLOAD_MB
      - MAX_DURATION_MINUTES
      - MAX_PENDING_JOBS
      - MAX_JOB_ATTEMPTS
      - LOG_LEVEL
      - LOG_FORMAT
    init: true # reaps finished ffmpeg processes and forwards signals
    stop_grace_period: 30s # time for the worker to put a running job back in the queue
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Lint and tests inside the image: docker compose run --rm --build tests
  tests:
    build:
      context: .
      target: test
    profiles:
      - tests

volumes:
  data:
