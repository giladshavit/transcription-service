name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Lint and tests inside the image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose run --rm --build tests

  service:
    # The path a reviewer takes: a clean checkout, the README commands, a real transcript.
    name: Build, start and use the service
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and wait until the service is healthy
        run: docker compose up --build --detach --wait
      - name: Transcribe the sample recording through the API
        run: |
          ./scripts/smoke_test.sh | tee transcript.txt
          grep --ignore-case --quiet "ask not what your country can do for you" transcript.txt
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
